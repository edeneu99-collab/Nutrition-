<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nutrition study hub</title>
<meta name="description" content="Plan, read and quiz, and mock-exam tool for the Nutrition exam.">
<meta name="theme-color" content="#2f5d50">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="icon" href="./icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nutrition Hub">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header>
<h1>Nutrition · study hub</h1>
<nav class="tabs" role="tablist" aria-label="Sections">
<button class="tab" role="tab" data-tab="plan" aria-selected="true">Plan</button>
<button class="tab" role="tab" data-tab="read" aria-selected="false">Read &amp; quiz</button>
<button class="tab" role="tab" data-tab="mock" aria-selected="false">Mock exams</button>
</nav>
<div class="tools">
<button class="btn" id="btnInstall" hidden>Install app</button>
<button class="btn" id="btnExport" title="Download your saved data as JSON">Export</button>
<button class="btn" id="btnImport" title="Load a previous export">Import</button>
<button class="btn" id="btnTheme" aria-label="Switch theme">Theme: auto</button>
</div>
</header>
<main id="app"></main>
<dialog id="dlg"><div id="dlgBody"></div></dialog>
<input type="file" id="file" accept="application/json,.json" hidden>
<p class="muted" style="text-align:center;padding:1rem 1rem 2rem">Runs entirely in your browser — your plan, notes, tags and scores are saved on this device only (localStorage). Use Export regularly to keep a backup.</p>
<script src="./data.js"></script>
<script src="./app.js"></script>
</body>
</html>
